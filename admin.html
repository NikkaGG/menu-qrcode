<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f5f3">
<title>Sushi Crazy · Администратор</title>
<link rel="stylesheet" href="/ops.css?v=20261001-ops-v1">
</head>
<body class="ops ops-admin">
<div class="login" id="login"><h1>Администратор</h1><p>Управление столами, QR-кодами и аналитикой.</p><form id="loginForm"><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN администратора"><button>Войти</button></form><div class="error" id="loginError"></div></div>
<main class="shell" id="app" hidden>
<header class="top"><div class="brand"><small>Sushi Crazy</small><h1>Админ-панель</h1></div><nav class="nav"><a href="/" target="_blank">Меню</a><a href="/kitchen" target="_blank">Кухня</a><a href="/staff" target="_blank">Зал</a><button type="button" id="logoutBtn">Выйти</button></nav></header>
<section class="stats" id="stats"></section>
<section class="grid"><article class="card"><div class="card-head"><div><h2>Последние 7 дней</h2><small>Заказы и выручка по дням</small></div><small id="updatedAt">—</small></div><div class="chart" id="chart"></div></article><article class="card"><div class="card-head"><div><h2>Способы расчёта</h2><small>По заказам за 7 дней</small></div></div><div class="payments" id="payments"></div></article></section>
<div class="section-head"><div><h2>Столы и QR-коды</h2><p>Создавай столы и печатай QR-коды для каждого из них.</p></div><form class="add-form" id="addTableForm"><input name="number" id="tableNumber" maxlength="20" placeholder="№ стола" required><input name="label" id="tableLabel" maxlength="80" placeholder="Название, например Стол 2"><button>+ Создать стол</button></form></div>
<section class="tables" id="tables"></section>
</main>
<div class="modal" id="qrModal"><div class="modal-card"><div class="modal-head"><div><small>QR-код стола</small><h2 id="qrTitle">Стол</h2></div><button class="x" type="button" id="closeQrBtn">×</button></div><div class="qr-box"><canvas id="qrCanvas" width="320" height="320"></canvas></div><input class="qr-url" id="qrUrl" readonly><div class="modal-actions"><button type="button" id="copyQrBtn">Скопировать ссылку</button><button type="button" id="downloadQrBtn">Скачать PNG</button></div></div></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
<script>
const API='https://gelezvudpcsnhqgjaqkl.supabase.co/functions/v1/admin-api';
let pin=sessionStorage.getItem('sushi-admin-pin')||'',state=null,busy=false,currentQrTable=null;
const h=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toLocaleString('ru-RU')+' ₸';
const payLabels={kaspi:'Kaspi',card:'Карта',cash:'Наличные',unknown:'Другое'};
async function api(action,payload={}){const response=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-admin-pin':pin},body:JSON.stringify({action,...payload})});const data=await response.json().catch(()=>({}));if(!response.ok){const error=new Error(data.error||'Ошибка');error.status=response.status;throw error}return data}
function notify(text){const el=document.getElementById('toast');el.textContent=text;el.classList.add('on');clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.classList.remove('on'),2300)}
function qrLink(table){return location.origin+'/?table='+encodeURIComponent(table.qr_token)}
function renderStats(a){document.getElementById('stats').innerHTML=[['Заказы · 24 часа',a.orders24],['Выручка · 24 часа',money(a.revenue24)],['Средний чек · 7 дней',money(a.averageCheck7)],['Открытые столы',a.openTables+' / '+a.activeTables]].map(x=>'<article class="stat"><span>'+h(x[0])+'</span><b>'+h(x[1])+'</b></article>').join('')}
function renderChart(a){const values=(a.daily||[]).map(x=>Number(x.revenue||0)),max=Math.max(1,...values);document.getElementById('chart').innerHTML=(a.daily||[]).map(day=>{const height=Math.max(4,Math.round((Number(day.revenue||0)/max)*120));const label=new Date(day.date+'T00:00:00Z').toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'});return '<div class="bar-wrap"><div class="bar-value">'+day.orders+'</div><div class="bar" style="height:'+height+'px" title="'+money(day.revenue)+'"></div><div class="bar-label">'+label+'</div></div>'}).join('')}
function renderPayments(a){const entries=Object.entries(a.payments||{}),total=entries.reduce((sum,x)=>sum+Number(x[1]||0),0),el=document.getElementById('payments');if(!entries.length){el.innerHTML='<div class="empty">Пока нет заказов</div>';return}el.innerHTML=entries.sort((a,b)=>b[1]-a[1]).map(([key,count])=>{const pct=total?Math.round(Number(count)*100/total):0;return '<div class="payment"><span>'+h(payLabels[key]||key)+'</span><div class="meter"><i style="width:'+pct+'%"></i></div><b>'+count+'</b></div>'}).join('')}
function tableCard(table){const label=table.label||('Стол '+table.table_number),active=!!table.is_active;return '<article class="table-card"><div class="table-top"><div class="table-title"><b>'+h(label)+'</b><span>№ '+h(table.table_number)+'</span></div><div class="badges"><span class="badge '+(active?'live':'off')+'">'+(active?'QR активен':'QR выключен')+'</span>'+(table.openSession?'<span class="badge">Стол открыт</span>':'')+'</div></div><div class="table-metrics"><div class="table-metric"><span>Заказов · 30 дней</span><b>'+Number(table.orders30||0)+'</b></div><div class="table-metric"><span>Выручка · 30 дней</span><b>'+money(table.revenue30)+'</b></div></div><div class="table-actions"><button class="primary" data-action="qr" data-id="'+h(table.id)+'">QR-код</button><button data-action="rename" data-id="'+h(table.id)+'">Изменить</button><button data-action="toggle" data-id="'+h(table.id)+'" data-active="'+(!active)+'">'+(active?'Выключить':'Включить')+'</button><button class="danger" data-action="rotate" data-id="'+h(table.id)+'">Новый QR</button></div></article>'}
function render(){const a=state.analytics||{};renderStats(a);renderChart(a);renderPayments(a);document.getElementById('tables').innerHTML=(state.tables||[]).length?(state.tables||[]).map(tableCard).join(''):'<div class="empty">Столов пока нет</div>';document.getElementById('updatedAt').textContent='Обновлено '+new Date(state.generatedAt||Date.now()).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
async function refresh(silent=false){if(busy)return;busy=true;try{state=await api('dashboard');render();document.getElementById('login').hidden=true;document.getElementById('app').hidden=false;document.getElementById('loginError').textContent=''}catch(error){if(error.status===401){sessionStorage.removeItem('sushi-admin-pin');pin='';document.getElementById('login').hidden=false;document.getElementById('app').hidden=true;if(!silent)document.getElementById('loginError').textContent='Неверный PIN администратора'}else if(!silent)document.getElementById('loginError').textContent=error.message}finally{busy=false}}
document.getElementById('loginForm').addEventListener('submit',event=>{event.preventDefault();pin=document.getElementById('pin').value.trim();sessionStorage.setItem('sushi-admin-pin',pin);document.getElementById('loginError').textContent='';refresh(false)});
document.getElementById('addTableForm').addEventListener('submit',async event=>{event.preventDefault();const tableNumber=document.getElementById('tableNumber').value.trim(),label=document.getElementById('tableLabel').value.trim();try{state=await api('create-table',{tableNumber,label});render();event.target.reset();notify('Стол создан')}catch(error){notify(error.message)}});
async function toggleTable(tableId,active){try{state=await api('set-table-active',{tableId,active});render();notify(active?'QR включён':'QR выключен')}catch(error){notify(error.message)}}
async function rotateQr(tableId){const table=(state.tables||[]).find(x=>x.id===tableId);if(!table)return;if(!confirm('Создать новый QR для '+(table.label||('стола '+table.table_number))+'? Старый QR перестанет работать.'))return;try{state=await api('rotate-table-qr',{tableId});render();notify('QR-код перевыпущен');openQr(tableId)}catch(error){notify(error.message)}}
async function renameTable(tableId){const table=(state.tables||[]).find(x=>x.id===tableId);if(!table)return;const tableNumber=prompt('Номер стола',table.table_number);if(tableNumber===null)return;const label=prompt('Название стола',table.label||('Стол '+table.table_number));if(label===null)return;try{state=await api('update-table',{tableId,tableNumber,label});render();notify('Стол обновлён')}catch(error){notify(error.message)}}
function openQr(tableId){const table=(state.tables||[]).find(x=>x.id===tableId);if(!table)return;currentQrTable=table;document.getElementById('qrTitle').textContent=table.label||('Стол '+table.table_number);document.getElementById('qrUrl').value=qrLink(table);document.getElementById('qrModal').classList.add('on');const canvas=document.getElementById('qrCanvas'),ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);if(window.QRCode&&QRCode.toCanvas){QRCode.toCanvas(canvas,qrLink(table),{width:320,margin:2,errorCorrectionLevel:'M'},error=>{if(error)notify('Не удалось построить QR')})}else{ctx.font='16px system-ui';ctx.textAlign='center';ctx.fillText('QR-библиотека не загрузилась',160,155);ctx.fillText('Скопируйте ссылку ниже',160,180)}}
function closeQr(){document.getElementById('qrModal').classList.remove('on');currentQrTable=null}
async function copyQrLink(){const field=document.getElementById('qrUrl');try{await navigator.clipboard.writeText(field.value);notify('Ссылка скопирована')}catch(_){field.select();document.execCommand('copy');notify('Ссылка скопирована')}}
function downloadQr(){if(!currentQrTable)return;const link=document.createElement('a');link.download='sushi-crazy-table-'+currentQrTable.table_number+'-qr.png';link.href=document.getElementById('qrCanvas').toDataURL('image/png');link.click()}
function logout(){sessionStorage.removeItem('sushi-admin-pin');location.reload()}
document.getElementById('tables').addEventListener('click',event=>{const btn=event.target.closest('button[data-action]');if(!btn)return;const id=btn.dataset.id,action=btn.dataset.action;if(action==='qr')openQr(id);if(action==='rename')renameTable(id);if(action==='toggle')toggleTable(id,btn.dataset.active==='true');if(action==='rotate')rotateQr(id)});
document.getElementById('logoutBtn').addEventListener('click',logout);document.getElementById('closeQrBtn').addEventListener('click',closeQr);document.getElementById('copyQrBtn').addEventListener('click',copyQrLink);document.getElementById('downloadQrBtn').addEventListener('click',downloadQr);document.getElementById('qrModal').addEventListener('click',event=>{if(event.target===event.currentTarget)closeQr()});document.addEventListener('keydown',event=>{if(event.key==='Escape')closeQr()});
if(pin)refresh(true);
</script>
</body></html>
