name: Restore pre-admin menu

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-pre-admin.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact pre-admin source
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/NikkaGG/menu-a.git /tmp/menu-source
          cd /tmp/menu-source
          git checkout --quiet 2b19e78f00b8e8ffbe1168169924c17e070f03d8

      - name: Replace target tree and push
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar --exclude=.git -C /tmp/menu-source -cf - . | tar -C "$GITHUB_WORKSPACE" -xf -
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore pre-admin menu from menu-a@2b19e78"
          git push origin HEAD:main
