<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sushi Crazy · Зал</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f4f4;color:#111;font:15px/1.4 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}
.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.top h1{margin:0;font-size:28px}.top nav{display:flex;gap:8px}.top a,.top button{border:0;border-radius:12px;padding:9px 12px;background:#fff;color:#111;text-decoration:none;font-weight:700}
.login{max-width:420px;margin:12vh auto;background:#fff;border-radius:24px;padding:24px;box-shadow:0 18px 50px #0001}.login h1{margin-top:0}.login input{width:100%;padding:14px;border:1px solid #ddd;border-radius:14px;font-size:20px;letter-spacing:.18em}.login button{width:100%;margin-top:10px;padding:14px;border:0;border-radius:14px;background:#111;color:#fff;font-weight:800}.err{color:#a32b2b;margin-top:8px}
h2{font-size:15px;color:#666;text-transform:uppercase;letter-spacing:.06em;margin:22px 0 9px}.requests{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.request{background:#fff;border-radius:17px;padding:14px;box-shadow:0 8px 22px #0000000a}.request b{font-size:17px}.request span{display:block;color:#777;margin:3px 0 10px}.request button{width:100%;border:0;border-radius:11px;padding:9px;background:#111;color:#fff;font-weight:800}
.tables{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.table{background:#fff;border-radius:18px;padding:15px}.tableHead{display:flex;justify-content:space-between;gap:12px}.tableHead b{font-size:19px}.badge{padding:5px 8px;border-radius:999px;background:#eee;font-size:11px;font-weight:800}.orders{display:grid;gap:7px;margin:12px 0}.order{display:flex;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:12px;background:#f6f6f6}.order.ready{background:#111;color:#fff}.order small{display:block;opacity:.65}.actions{display:flex;gap:8px}.actions button{flex:1;border:0;border-radius:11px;padding:10px;background:#eee;color:#111;font-weight:800}.actions .primary{background:#111;color:#fff}.actions button:disabled{opacity:.35}.empty{padding:18px;text-align:center;color:#999;background:#fff;border-radius:16px}
@media(max-width:720px){.requests,.tables{grid-template-columns:1fr}.top h1{font-size:23px}}
</style>
</head>
<body>
<div id="login" class="login"><h1>Зал</h1><p>Введите PIN персонала.</p><form id="loginForm"><input id="pin" inputmode="numeric" autocomplete="current-password" placeholder="PIN"><button>Войти</button></form><div id="loginErr" class="err"></div></div>
<div class="wrap" id="app" hidden>
<header class="top"><div><h1>Зал</h1><small id="updated">—</small></div><nav><a href="/kitchen">Кухня</a><button onclick="logout()">Выйти</button></nav></header>
<h2>Запросы гостей</h2><div id="requests" class="requests"></div><h2>Открытые столы</h2><div id="tables" class="tables"></div>
</div>
<script>
const API='https://gelezvudpcsnhqgjaqkl.supabase.co/functions/v1/staff-orders';
let pin=sessionStorage.getItem('sushi-staff-pin')||'',state=null,busy=false;
const h=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toLocaleString('ru-RU')+' ₸',labels={waiter:'Позвать официанта',bill:'Принести счёт',cutlery:'Нужны приборы'},status={submitted:'Отправлен',accepted:'Принят',preparing:'Готовится',ready:'Готов',served:'Подан',cancelled:'Отменён'},pay={kaspi:'Kaspi',card:'Карта',cash:'Наличные'};
async function api(action,payload={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-staff-pin':pin},body:JSON.stringify({action,...payload})});const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.error||'Ошибка');e.status=r.status;throw e}return d}
function tableBySession(id){const s=state.sessions.find(x=>x.id===id);return state.tables.find(x=>x.id===s?.table_id)}
function sessionOrders(id){return state.orders.filter(o=>o.table_session_id===id).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))}
function render(){
 const reqs=state.requests||[];requests.innerHTML=reqs.length?reqs.map(r=>{const t=tableBySession(r.table_session_id);return '<div class="request"><b>'+h(t?.label||('Стол '+(t?.table_number||'?')))+'</b><span>'+h(labels[r.kind]||r.kind)+' · '+new Date(r.created_at).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+'</span><button onclick="resolveReq('+r.id+')">Выполнено</button></div>'}).join(''):'<div class="empty">Нет новых запросов</div>';
 const sessions=state.sessions||[];tables.innerHTML=sessions.length?sessions.map(s=>{const t=state.tables.find(x=>x.id===s.table_id),orders=sessionOrders(s.id),active=orders.filter(o=>!['served','cancelled'].includes(o.status)),total=orders.filter(o=>o.status!=='cancelled').reduce((sum,o)=>sum+Number(o.total||0),0);
 return '<section class="table"><div class="tableHead"><div><b>'+h(t?.label||('Стол '+(t?.table_number||'?')))+'</b><br><small>Открыт '+new Date(s.opened_at).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+'</small></div><span class="badge">'+money(total)+'</span></div><div class="orders">'+(orders.length?orders.map(o=>'<div class="order '+(o.status==='ready'?'ready':'')+'"><div><b>#'+o.id+' · '+h(status[o.status]||o.status)+'</b><small>'+h(pay[o.payment_method]||o.payment_method)+'</small></div><strong>'+money(o.total)+'</strong></div>').join(''):'<div class="empty">Пока без заказов</div>')+'</div><div class="actions">'+(orders.some(o=>o.status==='ready')?'<button class="primary" onclick="serveReady(\''+s.id+'\')">Готовые поданы</button>':'')+'<button onclick="closeSession(\''+s.id+'\')" '+(active.length?'disabled':'')+'>Закрыть стол</button></div></section>'}).join(''):'<div class="empty">Нет открытых столов</div>';
 updated.textContent='Обновлено '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
async function refresh(silent=false){if(busy)return;busy=true;try{state=await api('dashboard');render();login.hidden=true;app.hidden=false}catch(e){if(e.status===401){sessionStorage.removeItem('sushi-staff-pin');pin='';login.hidden=false;app.hidden=true;if(!silent)loginErr.textContent='Неверный PIN'}}finally{busy=false}}
async function resolveReq(requestId){try{state=await api('resolve-request',{requestId});render()}catch(e){alert(e.message)}}
async function serveReady(sessionId){for(const o of sessionOrders(sessionId).filter(x=>x.status==='ready')){try{state=await api('update-order',{orderId:o.id,status:'served'})}catch(e){alert(e.message);break}}render()}
async function closeSession(sessionId){try{state=await api('close-session',{sessionId});render()}catch(e){alert(e.message)}}
function logout(){sessionStorage.removeItem('sushi-staff-pin');location.reload()}
loginForm.onsubmit=e=>{e.preventDefault();pin=document.getElementById('pin').value.trim();sessionStorage.setItem('sushi-staff-pin',pin);loginErr.textContent='';refresh(false)};
if(pin)refresh(true);setInterval(()=>{if(pin)refresh(true)},3000);
</script>
</body></html>
